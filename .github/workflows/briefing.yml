name: Generate daily briefing episode

on:
  schedule:
    # 3:52am Pacific, weekdays only. GitHub's scheduled workflows are only a
    # best-effort trigger and routinely fire late -- observed delays of
    # 1-2.5 hours are normal, not a bug. Triggering this early (instead of at
    # 6:52am) builds in enough buffer that the episode is still done well
    # before the target ~6am Pacific publish time even on a slow day.
    # An off-minute (not :00 or :30) keeps this out of GitHub's busiest
    # scheduling windows, so it fires closer to on time.
    # Pacific shifts between PST/PDT across the year -- if you notice the
    # actual run time drift by an hour after a time change, adjust this.
    - cron: '52 10 * * 1-5'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab, for manual testing

permissions:
  contents: write   # the job needs to commit the new episode back into the repo

jobs:
  build-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/generate_episode.py

      - name: Commit and push the new episode
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Add episode for $(date -u +%Y-%m-%d)"
          git push
